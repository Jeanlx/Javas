name: build java
on:
  workflow_dispatch:
  schedule:
    # Cada lunes (antes: dia 1 de cada mes). Asi los parches de Temurin/Semeru
    # llegan a tus imagenes en dias, no en semanas.
    - cron: "0 3 * * 1"
  push:
    branches:
      - master
      - main
    paths:
      - java/**
      - .github/workflows/java.yml

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: "yolks:java_${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - 8
          - 8j9
          - 11
          - 11j9
          - 16
          - 16j9
          - 17
          - 17j9
          - 18
          - 18j9
          - 19
          - 19j9
          - 21
          - 22
          - 23
          - 24
          - 25
    steps:
      - uses: actions/checkout@v4
      - name: Owner en minusculas (GHCR exige minusculas)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
        with:
            image: tonistiigi/binfmt:qemu-v7.0.0-28
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v4
        with:
          context: ./java
          file: ./java/${{ matrix.tag }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Descarga siempre la ultima version de la imagen base, nunca una
          # copia en cache: es lo que trae los parches del JDK.
          pull: true
          no-cache: true
          # Enlaza el paquete de GHCR con ESTE repositorio (sobrescribe el
          # LABEL del Dockerfile, que apunta a pterodactyl/yolks).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ env.OWNER }}/yolks:java_${{ matrix.tag }}
